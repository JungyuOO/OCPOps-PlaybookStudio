apiVersion: pbs.ocpops.io/v1alpha1
kind: PlaybookStudio
metadata:
  name: pbs
  namespace: pbs-ocpops
spec:
  image: ghcr.io/jungyuoo/ocpops-playbookstudio-app:v0.3.0
  ui:
    shellMode: aiops-workbench
  route:
    enabled: true
  chat:
    provider: lightspeed
  lightspeed:
    knowledgeMode: lightspeed-rag-with-pbs-private-context
    detectOperator: true
    manageOLSConfig: true
    caBundlePath: /var/run/secrets/kubernetes.io/serviceaccount/service-ca.crt
    insecureSkipTLSVerify: false
    auth:
      mode: service-account
      secretName: pbs-ols-auth
    mcp:
      enabled: true
      registerWithOLS: true
      serverName: pbs-tools
    networkPolicy:
      enabled: true
      targetNamespace: openshift-lightspeed
      allowFromNamespaces:
        - pbs-ocpops
      allowAllNamespaces: false
  console:
    enabled: true
    executorMode: service-account
  namespaceMode:
    autoCreate: false
  library:
    ingestion:
      outputFormat: pbs-private-context-markdown
      qdrantEnabled: false
  runtime:
    secretName: playbookstudio-secret
    config:
      ARTIFACTS_DIR: /app/artifacts
      CORPUS_SEED_DIR: /app/corpus
      EMBEDDING_BASE_URL: http://tei.cywell.co.kr/v1
      EMBEDDING_MODEL: dragonkue/bge-m3-ko
      LLM_ENDPOINT: http://cllm.cywell.co.kr/v1
      LLM_MODEL: gemma-4-26b-a4b-it-awq-8bit
      OBJECT_STORAGE_ROOT: /app/storage
      OCP_API_BASE_URL: https://api.ocp.cywell.local:6443
      OCP_DEFAULT_NAMESPACE: pbs-ocpops
      OCP_INSECURE_SKIP_TLS_VERIFY: "true"
      POSTGRES_DB: playbookstudio
      POSTGRES_USER: admin
      QDRANT_ENABLED: "false"
      RERANKER_BASE_URL: http://bge-reranker:80
      RERANKER_ENABLED: "false"
      SOURCE_MANIFEST_PATH: /app/corpus/manifests/official/ocp_ko_4_20_approved_ko.json
      TERMINAL_ENABLED: "true"
      TERMINAL_HOST: 0.0.0.0
      TERMINAL_SHELL: /app/scripts/terminal-entrypoint.sh
      TERMINAL_USER_WORKSPACE_ENABLED: "false"
      TERMINAL_WS_PORT: "8770"
