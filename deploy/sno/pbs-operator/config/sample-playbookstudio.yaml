apiVersion: pbs.ocpops.io/v1alpha1
kind: PlaybookStudio
metadata:
  name: pbs
  namespace: pbs-ocpops
spec:
  image: ghcr.io/jungyuoo/ocpops-playbookstudio-app:v0.3.0
  ui:
    shellMode: aiops-workbench
  route:
    enabled: true
  chat:
    provider: lightspeed
  lightspeed:
    knowledgeMode: lightspeed-rag-with-pbs-private-context
    detectOperator: true
    manageOLSConfig: true
    auth:
      mode: service-account
      secretName: pbs-ols-auth
    mcp:
      enabled: true
      registerWithOLS: true
      serverName: pbs-tools
  console:
    enabled: true
    executorMode: service-account
  namespaceMode:
    autoCreate: false
  library:
    ingestion:
      outputFormat: pbs-private-context-markdown
      qdrantEnabled: true
