apiVersion: v1
kind: ServiceAccount
metadata:
  name: pbs-operator
  namespace: pbs-ocpops
  labels:
    app.kubernetes.io/name: pbs-operator
    app.kubernetes.io/part-of: playbookstudio
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pbs-operator
  namespace: pbs-ocpops
  labels:
    app.kubernetes.io/name: pbs-operator
    app.kubernetes.io/part-of: playbookstudio
rules:
  - apiGroups: ["pbs.ocpops.io"]
    resources: ["playbookstudios", "playbookstudios/status"]
    verbs: ["get", "list", "watch", "patch", "update"]
  - apiGroups: ["", "apps", "route.openshift.io", "rbac.authorization.k8s.io"]
    resources:
      - configmaps
      - services
      - serviceaccounts
      - deployments
      - routes
      - roles
      - rolebindings
    verbs: ["get", "list", "watch", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pbs-operator
  namespace: pbs-ocpops
  labels:
    app.kubernetes.io/name: pbs-operator
    app.kubernetes.io/part-of: playbookstudio
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: pbs-operator
subjects:
  - kind: ServiceAccount
    name: pbs-operator
    namespace: pbs-ocpops
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: pbs-operator-lightspeed-networkpolicy
  labels:
    app.kubernetes.io/name: pbs-operator
    app.kubernetes.io/part-of: playbookstudio
rules:
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: pbs-operator-lightspeed-networkpolicy
  labels:
    app.kubernetes.io/name: pbs-operator
    app.kubernetes.io/part-of: playbookstudio
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: pbs-operator-lightspeed-networkpolicy
subjects:
  - kind: ServiceAccount
    name: pbs-operator
    namespace: pbs-ocpops
