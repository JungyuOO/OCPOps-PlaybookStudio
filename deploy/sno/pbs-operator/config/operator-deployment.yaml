apiVersion: apps/v1
kind: Deployment
metadata:
  name: pbs-operator
  namespace: pbs-ocpops
  labels:
    app.kubernetes.io/name: pbs-operator
    app.kubernetes.io/part-of: playbookstudio
    pbs.ocpops.io/operator-ready: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: pbs-operator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pbs-operator
        app.kubernetes.io/part-of: playbookstudio
    spec:
      serviceAccountName: pbs-operator
      containers:
        - name: operator
          image: ghcr.io/jungyuoo/ocpops-playbookstudio-operator:v0.3.0
          imagePullPolicy: IfNotPresent
          command:
            - python
            - -m
            - play_book_studio.pbs_operator.runtime
          env:
            - name: PBS_OPERATOR_MODE
              value: dry-run
            - name: PBS_OPERATOR_WATCH_ENABLED
              value: "true"
            - name: PBS_OPERATOR_APPLY_ENABLED
              value: "false"
            - name: PBS_OPERATOR_RECONNECT_SECONDS
              value: "10"
            - name: WATCH_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
