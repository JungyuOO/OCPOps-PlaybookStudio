apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: playbookstudios.pbs.ocpops.io
spec:
  group: pbs.ocpops.io
  names:
    kind: PlaybookStudio
    listKind: PlaybookStudioList
    plural: playbookstudios
    singular: playbookstudio
    shortNames:
      - pbs
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                image:
                  type: string
                ui:
                  type: object
                  properties:
                    shellMode:
                      type: string
                      enum: ["classic", "aiops-workbench"]
                route:
                  type: object
                  properties:
                    enabled:
                      type: boolean
                chat:
                  type: object
                  properties:
                    provider:
                      type: string
                      enum: ["internal", "lightspeed"]
                lightspeed:
                  type: object
                  properties:
                    knowledgeMode:
                      type: string
                      enum:
                        - lightspeed-rag
                        - lightspeed-rag-with-pbs-private-context
                        - pbs-rag
                        - hybrid
                    detectOperator:
                      type: boolean
                    manageOLSConfig:
                      type: boolean
                    insecureSkipTLSVerify:
                      type: boolean
                    auth:
                      type: object
                      properties:
                        mode:
                          type: string
                          enum: ["test-admin-secret", "service-account", "user-token"]
                        secretName:
                          type: string
                    mcp:
                      type: object
                      properties:
                        enabled:
                          type: boolean
                        registerWithOLS:
                          type: boolean
                        serverName:
                          type: string
                    networkPolicy:
                      type: object
                      properties:
                        enabled:
                          type: boolean
                        targetNamespace:
                          type: string
                        allowFromNamespaces:
                          type: array
                          items:
                            type: string
                        allowAllNamespaces:
                          type: boolean
                console:
                  type: object
                  properties:
                    enabled:
                      type: boolean
                    executorMode:
                      type: string
                      enum: ["local", "test-admin-secret", "service-account", "user-token"]
                namespaceMode:
                  type: object
                  properties:
                    autoCreate:
                      type: boolean
                library:
                  type: object
                  properties:
                    ingestion:
                      type: object
                      properties:
                        outputFormat:
                          type: string
                        qdrantEnabled:
                          type: boolean
                runtime:
                  type: object
                  properties:
                    secretName:
                      type: string
                    config:
                      type: object
                      additionalProperties:
                        type: string
            status:
              type: object
              properties:
                phase:
                  type: string
                lightspeedReady:
                  type: boolean
                mcpRegistered:
                  type: boolean
      subresources:
        status: {}
