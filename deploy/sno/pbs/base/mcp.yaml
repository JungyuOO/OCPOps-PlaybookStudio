apiVersion: apps/v1
kind: Deployment
metadata:
  name: pbs-mcp
  labels:
    app.kubernetes.io/name: pbs-mcp
    app.kubernetes.io/part-of: playbookstudio
    pbs.ocpops.io/operator-ready: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: pbs-mcp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pbs-mcp
        app.kubernetes.io/part-of: playbookstudio
    spec:
      serviceAccountName: playbookstudio
      containers:
        - name: mcp
          image: ghcr.io/jungyuoo/ocpops-playbookstudio-app:v0.3.0
          imagePullPolicy: IfNotPresent
          command:
            - python
            - -m
            - play_book_studio.mcp.server
          envFrom:
            - configMapRef:
                name: playbookstudio-v030-config
          ports:
            - name: mcp
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: mcp
            initialDelaySeconds: 10
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: pbs-mcp
  labels:
    app.kubernetes.io/name: pbs-mcp
    app.kubernetes.io/part-of: playbookstudio
spec:
  selector:
    app.kubernetes.io/name: pbs-mcp
  ports:
    - name: mcp
      port: 8080
      targetPort: mcp
