apiVersion: apps/v1
kind: Deployment
metadata:
  name: playbookstudio-app
  labels:
    app.kubernetes.io/name: playbookstudio-app
    app.kubernetes.io/part-of: playbookstudio
    pbs.ocpops.io/operator-ready: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: playbookstudio-app
  template:
    metadata:
      labels:
        app.kubernetes.io/name: playbookstudio-app
        app.kubernetes.io/part-of: playbookstudio
    spec:
      serviceAccountName: playbookstudio
      containers:
        - name: app
          image: ghcr.io/jungyuoo/ocpops-playbookstudio-app:v0.3.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8765
            - name: terminal-ws
              containerPort: 8770
          envFrom:
            - configMapRef:
                name: playbookstudio-v030-config
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: playbookstudio-secret
                  key: POSTGRES_PASSWORD
            - name: OLS_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: pbs-ols-auth
                  key: token
                  optional: true
          volumeMounts:
            - name: app-storage
              mountPath: /app/storage
            - name: app-artifacts
              mountPath: /app/artifacts
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 15
      volumes:
        - name: app-storage
          persistentVolumeClaim:
            claimName: app-storage
        - name: app-artifacts
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: playbookstudio-app
  labels:
    app.kubernetes.io/name: playbookstudio-app
    app.kubernetes.io/part-of: playbookstudio
spec:
  selector:
    app.kubernetes.io/name: playbookstudio-app
  ports:
    - name: http
      port: 8765
      targetPort: http
    - name: terminal-ws
      port: 8770
      targetPort: terminal-ws
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: playbookstudio-web
  labels:
    app.kubernetes.io/name: playbookstudio-web
    app.kubernetes.io/part-of: playbookstudio
    pbs.ocpops.io/operator-ready: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: playbookstudio-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: playbookstudio-web
        app.kubernetes.io/part-of: playbookstudio
    spec:
      serviceAccountName: playbookstudio
      containers:
        - name: web
          image: ghcr.io/jungyuoo/ocpops-playbookstudio-web:v0.3.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: playbookstudio-web
  labels:
    app.kubernetes.io/name: playbookstudio-web
    app.kubernetes.io/part-of: playbookstudio
spec:
  selector:
    app.kubernetes.io/name: playbookstudio-web
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: app-storage
  labels:
    app.kubernetes.io/part-of: playbookstudio
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: playbookstudio
  labels:
    app.kubernetes.io/name: playbookstudio-web
    app.kubernetes.io/part-of: playbookstudio
spec:
  to:
    kind: Service
    name: playbookstudio-web
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
