apiVersion: v1
kind: ConfigMap
metadata:
  name: playbookstudio-v030-config
  labels:
    app.kubernetes.io/name: playbookstudio
    app.kubernetes.io/part-of: playbookstudio
    pbs.ocpops.io/operator-ready: "true"
data:
  CHAT_PROVIDER: lightspeed
  OLS_BASE_URL: http://ols-app-server.openshift-lightspeed.svc.cluster.local:8080
  OLS_AUTH_MODE: service-account
  OLS_AUTH_SECRET_NAME: pbs-ols-auth
  OLS_TIMEOUT_SECONDS: "30"
  PBS_AUTO_CREATE_NAMESPACE: "false"
  PBS_NAMESPACE_MODE: disabled
  TERMINAL_USER_WORKSPACE_ENABLED: "true"
  CONSOLE_EXECUTOR_MODE: service-account
  BYOK_PIPELINE_ENABLED: "true"
  BYOK_OUTPUT_MODE: dry-run
  BYOK_IMAGE_REPOSITORY: image-registry.openshift-image-registry.svc:5000/pbs-ocpops/pbs-knowledge
  BYOK_REGISTRY_SECRET_NAME: pbs-byok-registry
  PBS_OPERATOR_READY_MODE: "true"
  PBS_OPERATOR_MANIFEST_PROFILE: sno
  QDRANT_URL: http://qdrant:6333
  QDRANT_COLLECTION: openshift_docs
  OCP_API_BASE_URL: https://api.ocp.cywell.local:6443
  OCP_DEFAULT_NAMESPACE: pbs-ocpops
  OBJECT_STORAGE_ROOT: /app/storage
  ARTIFACTS_DIR: /app/artifacts
