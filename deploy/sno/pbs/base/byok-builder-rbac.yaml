apiVersion: v1
kind: ServiceAccount
metadata:
  name: pbs-byok-builder
  labels:
    app.kubernetes.io/name: pbs-byok-builder
    app.kubernetes.io/part-of: playbookstudio
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pbs-byok-builder
  labels:
    app.kubernetes.io/name: pbs-byok-builder
    app.kubernetes.io/part-of: playbookstudio
rules:
  - apiGroups: [""]
    resources: ["configmaps", "secrets", "persistentvolumeclaims"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list", "watch"]
  - apiGroups: ["image.openshift.io"]
    resources: ["imagestreams", "imagestreamtags"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pbs-byok-builder
  labels:
    app.kubernetes.io/name: pbs-byok-builder
    app.kubernetes.io/part-of: playbookstudio
subjects:
  - kind: ServiceAccount
    name: pbs-byok-builder
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: pbs-byok-builder
