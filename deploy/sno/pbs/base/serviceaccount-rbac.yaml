apiVersion: v1
kind: ServiceAccount
metadata:
  name: playbookstudio
  labels:
    app.kubernetes.io/name: playbookstudio
    app.kubernetes.io/part-of: playbookstudio
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: terminal-broker
  labels:
    app.kubernetes.io/name: terminal-broker
    app.kubernetes.io/part-of: playbookstudio
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: pbs-console-executor
  labels:
    app.kubernetes.io/name: pbs-console-executor
    app.kubernetes.io/part-of: playbookstudio
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pbs-console-read
  labels:
    app.kubernetes.io/name: pbs-console-executor
    app.kubernetes.io/part-of: playbookstudio
rules:
  - apiGroups: [""]
    resources: ["pods", "services", "configmaps", "events", "persistentvolumeclaims"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "daemonsets", "replicasets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["route.openshift.io"]
    resources: ["routes"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pbs-console-guarded-write
  labels:
    app.kubernetes.io/name: pbs-console-executor
    app.kubernetes.io/part-of: playbookstudio
    pbs.ocpops.io/requires-approval: "true"
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["patch", "update"]
  - apiGroups: [""]
    resources: ["services", "configmaps"]
    verbs: ["patch", "update"]
  - apiGroups: ["route.openshift.io"]
    resources: ["routes"]
    verbs: ["patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pbs-console-read
  labels:
    app.kubernetes.io/name: pbs-console-executor
    app.kubernetes.io/part-of: playbookstudio
subjects:
  - kind: ServiceAccount
    name: pbs-console-executor
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: pbs-console-read
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pbs-console-guarded-write
  labels:
    app.kubernetes.io/name: pbs-console-executor
    app.kubernetes.io/part-of: playbookstudio
    pbs.ocpops.io/requires-approval: "true"
subjects:
  - kind: ServiceAccount
    name: pbs-console-executor
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: pbs-console-guarded-write
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: pbs-terminal-broker
  labels:
    app.kubernetes.io/name: terminal-broker
    app.kubernetes.io/part-of: playbookstudio
rules:
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["create", "get", "list", "patch", "delete"]
  - apiGroups: [""]
    resources: ["configmaps", "events", "persistentvolumeclaims", "pods", "secrets", "serviceaccounts", "services"]
    verbs: ["create", "get", "list", "watch", "patch", "update", "delete"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get", "list"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets", "statefulsets"]
    verbs: ["create", "get", "list", "watch", "patch", "update", "delete"]
  - apiGroups: ["batch"]
    resources: ["cronjobs", "jobs"]
    verbs: ["create", "get", "list", "watch", "patch", "update", "delete"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["create", "get", "list", "patch", "update", "delete"]
  - apiGroups: ["project.openshift.io"]
    resources: ["projects"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["route.openshift.io"]
    resources: ["routes"]
    verbs: ["create", "get", "list", "watch", "patch", "update", "delete"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["rolebindings", "roles"]
    verbs: ["create", "get", "list", "patch", "update", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: pbs-terminal-broker
  labels:
    app.kubernetes.io/name: terminal-broker
    app.kubernetes.io/part-of: playbookstudio
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: pbs-terminal-broker
subjects:
  - kind: ServiceAccount
    name: terminal-broker
    namespace: pbs-ocpops
