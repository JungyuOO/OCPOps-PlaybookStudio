apiVersion: v1
kind: ServiceAccount
metadata:
  name: playbookstudio
  labels:
    app.kubernetes.io/name: playbookstudio
    app.kubernetes.io/part-of: playbookstudio
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: pbs-console-executor
  labels:
    app.kubernetes.io/name: pbs-console-executor
    app.kubernetes.io/part-of: playbookstudio
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pbs-console-read
  labels:
    app.kubernetes.io/name: pbs-console-executor
    app.kubernetes.io/part-of: playbookstudio
rules:
  - apiGroups: [""]
    resources: ["pods", "services", "configmaps", "events", "persistentvolumeclaims"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "daemonsets", "replicasets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["route.openshift.io"]
    resources: ["routes"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pbs-console-guarded-write
  labels:
    app.kubernetes.io/name: pbs-console-executor
    app.kubernetes.io/part-of: playbookstudio
    pbs.ocpops.io/requires-approval: "true"
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["patch", "update"]
  - apiGroups: [""]
    resources: ["services", "configmaps"]
    verbs: ["patch", "update"]
  - apiGroups: ["route.openshift.io"]
    resources: ["routes"]
    verbs: ["patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pbs-console-read
  labels:
    app.kubernetes.io/name: pbs-console-executor
    app.kubernetes.io/part-of: playbookstudio
subjects:
  - kind: ServiceAccount
    name: pbs-console-executor
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: pbs-console-read
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pbs-console-guarded-write
  labels:
    app.kubernetes.io/name: pbs-console-executor
    app.kubernetes.io/part-of: playbookstudio
    pbs.ocpops.io/requires-approval: "true"
subjects:
  - kind: ServiceAccount
    name: pbs-console-executor
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: pbs-console-guarded-write
